<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Campos Law Firm</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <div class="header-inner">
                <div class="logo"><a href="index.html" style="text-decoration: none;"><h1>Campos <span>Law Firm</span></h1><p>Abogados en Español</p></a></div>
                <nav class="nav"><ul><li><a href="index.html">Inicio</a></li><li><a href="inmigracion.html">Inmigración</a></li><li><a href="familia.html">Familia</a></li><li><a href="criminal.html">Criminal</a></li><li><a href="negocios.html">Negocios</a></li><li><a href="contacto.html">Contacto</a></li></ul></nav>
                <div class="menu-btn"><i class="fas fa-bars"></i></div>
            </div>
        </div>
    </header>

    <section class="contact-page" style="padding: 120px 0 80px;">
        <div class="container">
            <div class="section-header"><h2>Contáctanos</h2><p>Cuéntanos los detalles de tu situación y nosotros nos encargamos del resto</p></div>
            <div class="contact-wrapper" style="display: grid; grid-template-columns: 1fr 1fr; gap: 50px; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                <form class="contact-form" style="padding: 40px;" id="contactForm">
                    <input type="text" placeholder="Nombre completo" required style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 5px;">
                    <input type="email" placeholder="Correo electrónico" required style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 5px;">
                    <input type="tel" placeholder="Teléfono" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 5px;">
                    <select required style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 5px;">
                        <option value="">Selecciona un área de interés</option>
                        <option>Inmigración</option><option>Derecho Familiar</option><option>Defensa Criminal</option><option>Negocios</option>
                    </select>
                    <textarea rows="5" placeholder="Cuéntanos tu caso o consulta..." style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 5px;"></textarea>
                    <button type="submit" class="btn btn-primary">Enviar mensaje →</button>
                    <p class="form-message"></p>
                </form>
                <div class="contact-map"><iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.9663095343026!2d-74.00625868459471!3d40.71272837933068!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25a316bbcfbdf%3A0xc896d4d6acde0c2e!2sCampos%20Law%20Firm!5e0!3m2!1ses!2sus!4v1647899999999!5m2!1ses!2sus" allowfullscreen="" loading="lazy" style="width: 100%; height: 100%; min-height: 500px; border: none;"></iframe></div>
            </div>
        </div>
    </section>

    <footer class="footer">...</footer>
    <script src="script.js"></script>
</body>
</html>
